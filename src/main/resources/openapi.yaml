components:
  schemas:
    Error:
      description: Data model describing error information.
      properties:
        code:
          description: code value for the Error resource.
          type: string
        message:
          description: message value for the Error resource.
          type: string
      required:
      - code
      - message
      type: object
    LoginRequest:
      description: Data model describing login request information.
      example:
        password: password
        email: email
      properties:
        email:
          description: email value for the LoginRequest resource.
          format: email
          type: string
        password:
          description: password value for the LoginRequest resource.
          format: password
          type: string
      required:
      - email
      - password
      type: object
    AuthToken:
      description: Data model describing auth token information.
      example:
        expiresIn: 3600
        accessToken: accessToken
        tokenType: Bearer
      properties:
        accessToken:
          description: accessToken value for the AuthToken resource.
          type: string
        tokenType:
          description: tokenType value for the AuthToken resource.
          example: Bearer
          type: string
        expiresIn:
          description: expiresIn value for the AuthToken resource.
          example: 3600
          type: integer
      required:
      - accessToken
      - expiresIn
      - tokenType
      type: object
    ProductInput:
      description: Data model describing product input information.
      example:
        price: 0.08008281904610115
        name: name
        active: true
        sku: sku
        category: category
      properties:
        sku:
          description: sku value for the ProductInput resource.
          minLength: 1
          type: string
        name:
          description: name value for the ProductInput resource.
          minLength: 2
          type: string
        category:
          description: category value for the ProductInput resource.
          type: string
        price:
          description: price value for the ProductInput resource.
          format: double
          minimum: 0
          type: number
        active:
          default: true
          description: active value for the ProductInput resource.
          type: boolean
      required:
      - name
      - price
      - sku
      type: object
    Product:
      allOf:
      - $ref: "#/components/schemas/ProductInput"
      - properties:
          id:
            readOnly: true
            type: integer
        required:
        - id
        type: object
      description: Data model describing product information.
    WarehouseInput:
      description: Data model describing warehouse input information.
      example:
        name: name
        location: location
      properties:
        name:
          description: name value for the WarehouseInput resource.
          minLength: 2
          type: string
        location:
