openapi: 3.0.3
info:
  contact:
    email: api-support@example.com
    name: Inventory API Support
  description: "Sample API specification for managing products, warehouses, stock,\
    \ orders and shipments. Uses example data and a placeholder base URL."
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Inventory and Order Management API
  version: 2.0.0
servers:
- description: Placeholder server; replace with actual endpoint
  url: https://api.example.com/v1
security:
- bearerAuth: []
tags:
- description: Authenticate API consumers and obtain access tokens.
  name: Authentication
- description: "Create, list, update and manage products in the catalog."
  name: Products
- description: Register and retrieve warehouses for inventory storage.
  name: Warehouses
- description: Read stock availability and record adjustments.
  name: Inventory
- description: "Create, view and cancel customer orders."
  name: Orders
- description: "Create shipments, check their details and update statuses."
  name: Shipments
paths:
  /auth/login:
    post:
      description: Authenticates a user with their email address and password and
        returns a bearer access token for protected API operations. This endpoint
        is public and does not require a token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        description: Request payload for create access token.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
          description: Login successful (HTTP 200).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
      security: []
      summary: Create access token
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Authentication
  /products:
    get:
      description: List products. Retrieves the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: listProducts
      parameters:
      - description: "Optional filter or selection value: search."
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: "Optional filter or selection value: category."
        explode: true
        in: query
        name: category
        required: false
        schema:
          type: string
        style: form
      - description: "Optional filter or selection value: limit."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Product"
                type: array
          description: Products retrieved (HTTP 200).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
      security:
      - bearerAuth: []
      summary: List products
      tags:
      - Products
      x-accepts: application/json
      x-tags:
      - tag: Products
    post:
      description: Create product. Submits the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        description: Request payload for create product.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product created (HTTP 201).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict (HTTP 409).
      security:
      - bearerAuth: []
      summary: Create product
      tags:
      - Products
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Products
  /products/{productId}:
    delete:
      description: Delete product. Deletes the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: deleteProduct
      parameters:
      - description: "Required resource identifier: productId."
        explode: false
        in: path
        name: productId
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "204":
          description: Product deleted (HTTP 204).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict (HTTP 409).
      security:
      - bearerAuth: []
      summary: Delete product
      tags:
      - Products
      x-accepts: application/json
      x-tags:
      - tag: Products
    get:
      description: Get product by ID. Retrieves the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: getProduct
      parameters:
      - description: "Required resource identifier: productId."
        explode: false
        in: path
        name: productId
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product retrieved (HTTP 200).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
      security:
      - bearerAuth: []
      summary: Get product by ID
      tags:
      - Products
      x-accepts: application/json
      x-tags:
      - tag: Products
    put:
      description: Replace product. Replaces the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: updateProduct
      parameters:
      - description: "Required resource identifier: productId."
        explode: false
        in: path
        name: productId
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        description: Request payload for replace product.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product updated (HTTP 200).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
      security:
      - bearerAuth: []
      summary: Replace product
      tags:
      - Products
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Products
  /warehouses:
    get:
      description: List warehouses. Retrieves the relevant resource using the supplied
