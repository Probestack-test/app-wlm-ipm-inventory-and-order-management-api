          description: Order created (HTTP 201).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
