      operationId: getWarehouse
      parameters:
      - description: "Required resource identifier: warehouseId."
        explode: false
        in: path
        name: warehouseId
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
          description: Warehouse retrieved (HTTP 200).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
      security:
      - bearerAuth: []
      summary: Get warehouse
      tags:
      - Warehouses
      x-accepts: application/json
      x-tags:
      - tag: Warehouses
  /inventory:
    get:
      description: List stock levels. Retrieves the relevant resource using the supplied
        inputs. Requires a bearer access token unless this operation explicitly allows
        anonymous access. Returns the documented HTTP status codes and response schemas.
      operationId: listInventory
      parameters:
