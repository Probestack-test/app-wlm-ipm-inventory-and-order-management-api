          description: Warehouse created (HTTP 201).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request (HTTP 400).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized (HTTP 401).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict (HTTP 409).
      security:
      - bearerAuth: []
      summary: Create warehouse
      tags:
      - Warehouses
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Warehouses
  /warehouses/{warehouseId}:
    get:
      description: Get warehouse. Retrieves the relevant resource using the supplied
